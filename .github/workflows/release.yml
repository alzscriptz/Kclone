name: Kclone Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate
        run: python -m py_compile kclone.py kclone_mcp_server.py build.py
      - name: Package ONE EXE
        run: python build.py
      - name: Verify
        shell: powershell
        run: |
          if (!(Test-Path "dist\Kclone.exe")) { throw "Kclone.exe was not produced." }
          Write-Host "Kclone.exe = $((Get-Item 'dist\Kclone.exe').Length) bytes"
      - name: Upload ONE EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kclone-Windows
          path: dist/Kclone.exe
          if-no-files-found: error
          retention-days: 30
      - name: Release ONE EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kclone v0.1.${{ github.run_number }}
          body: |
            Kclone Windows single-executable build.
            MCP, AI integration, OS builder and project tooling are bundled into Kclone.exe.
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/Kclone.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
