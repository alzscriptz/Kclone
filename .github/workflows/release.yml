name: Kclone Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Kclone.exe
        run: python build.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kclone-Windows
          path: dist/Kclone.exe

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Kclone v0.1.0
          prerelease: true
          make_latest: false
          files: dist/Kclone.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
