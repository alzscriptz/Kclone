name: Kclone Windows EXE Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate source
        run: python -m py_compile kclone.py kclone_mcp_server.py build.py
      - name: Build Kclone and MCP
        run: python build.py
      - name: Verify executables
        shell: powershell
        run: |
          if (!(Test-Path "dist\Kclone.exe")) { throw "Kclone.exe was not produced." }
          if (!(Test-Path "dist\Kclone-MCP.exe")) { throw "Kclone-MCP.exe was not produced." }
          Write-Host "Kclone.exe: $((Get-Item 'dist\Kclone.exe').Length) bytes"
          Write-Host "Kclone-MCP.exe: $((Get-Item 'dist\Kclone-MCP.exe').Length) bytes"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kclone-Windows
          path: |
            dist/Kclone.exe
            dist/Kclone-MCP.exe
          if-no-files-found: error
          retention-days: 30
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kclone v0.1.${{ github.run_number }}
          body: |
            Kclone Windows build
            Includes Kclone.exe and Kclone-MCP.exe.
            Commit: ${{ github.sha }}
            Build: ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            dist/Kclone.exe
            dist/Kclone-MCP.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
